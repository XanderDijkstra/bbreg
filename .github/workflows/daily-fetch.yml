name: Daily Brreg Fetch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-fetch endpoint
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/daily-fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
